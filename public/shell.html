<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <style>
      /* ponytail: token values duplicated from app/globals.css :root / .dark — this
         file must stay static and data-free, so it cannot import the app's
         build-hashed CSS. Re-check these against app/globals.css whenever the
         token layer moves. --float-shadow duplicates --elevation-float's first
         layer only — the shell has no live content behind it, so the second
         contact-shadow layer buys nothing. */
      :root {
        --background: #f4f4f2;
        --card: #ffffff;
        --muted: #e9e9e6;
        --border: rgb(20 21 26 / 0.10);
        --radius: 0.875rem;
        --float-shadow: 0 8px 24px -8px rgb(20 21 26 / 0.18);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #15161c;
          --card: #1e2029;
          --muted: #101116;
          --border: rgb(237 238 242 / 10%);
          --float-shadow: 0 10px 28px -10px rgb(0 0 0 / 0.60);
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--background);
        font-family: system-ui;
      }
      /* ponytail: .header/.bottom-bar stay opaque — there is nothing behind a
         static shell to blur, so a backdrop-filter here would cost a compositor
         pass at the worst possible moment for zero benefit. Do not add glass
         "for parity"; the real chrome's glass reads over live content, not this.
         .bottom-bar's rim + shadow now do the job the removed border-top used to. */
      .header {
        height: calc(3.5rem + env(safe-area-inset-top));
        border-bottom: 1px solid var(--border);
      }
      .column {
        max-width: 640px;
        margin: 0 auto;
        padding: 1rem;
        display: grid;
        gap: 0.75rem;
      }
      .group {
        border-radius: var(--radius);
        background: var(--card);
        box-shadow: 0 0 0 1px var(--border);
      }
      .row {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 1rem;
        min-height: 4rem;
        padding: 0.625rem 0.875rem;
        position: relative;
      }
      .row + .row::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 4.625rem;
        height: 1px;
        background: var(--border);
      }
      .tile {
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 1.125rem;
        background: var(--muted);
        flex: none;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .lines {
        display: grid;
        gap: 0.375rem;
        flex: 1;
      }
      .bar {
        height: 1rem;
        border-radius: 0.625rem;
        background: var(--muted);
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .bar.short {
        height: 0.75rem;
        width: 62.5%;
      }
      .bottom-bar {
        position: fixed;
        inset: auto 1rem max(0.75rem, env(safe-area-inset-bottom)) 1rem;
        max-width: calc(640px - 2rem);
        margin: 0 auto;
        height: 4rem;
        border-radius: 9999px;
        /* --card, not --background: a floating capsule painted in the page's own
           background colour is invisible except for its rim. The real capsule
           reads lighter than the page because it is 76%-opaque glass over
           content; --card is the static stand-in for that. */
        background: var(--card);
        box-shadow: 0 0 0 1px var(--border), var(--float-shadow);
      }
      @keyframes pulse {
        50% {
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div class="header"></div>
    <div class="column">
      <div class="group">
        <div class="row">
          <div class="tile"></div>
          <div class="lines">
            <div class="bar"></div>
            <div class="bar short"></div>
          </div>
        </div>
        <div class="row">
          <div class="tile"></div>
          <div class="lines">
            <div class="bar"></div>
            <div class="bar short"></div>
          </div>
        </div>
        <div class="row">
          <div class="tile"></div>
          <div class="lines">
            <div class="bar"></div>
            <div class="bar short"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="bottom-bar"></div>
    <script>
      // Served by the service worker when the network lost a 400ms race. Reload to
      // get the real page: the browser keeps painting this skeleton for the whole
      // navigation, so the handoff is invisible. The SW serves this shell as a
      // timeout fallback at most once per worker lifetime, so the reload always
      // races a clean network-first fetch and cannot loop.
      addEventListener("load", () => {
        // ponytail: only reload when this shell is standing in for another route —
        // a direct visit to /shell.html would otherwise reload itself forever.
        if (navigator.onLine && location.pathname !== "/shell.html") location.reload();
      });
    </script>
  </body>
</html>
